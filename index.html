<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Public GitHub Pages projects by garinasset.">
    <title>下载中心 - 嘉林资产基础设施</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500&family=Work+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="下载中心" />
    <link rel="manifest" href="/site.webmanifest" />
    <script src="./assets/js/app.js" defer></script>
</head>

<body class="light" id="theme-root">
    <div class="page-wrapper">
        <header class="header">
            <div class="header-upper">
                <div class="container header-top">
                    <a class="logo" href="./" aria-label="Home" title="downloads.garinasset.com">
                        <i class="fa-solid fa-folder-tree" aria-hidden="true"></i>
                    </a>
                    <h1 class="brand-text"><a href="./">downloads.garinasset.com</a></h1>
                    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle Light/Dark Mode"
                        aria-pressed="false" title="Toggle Light/Dark Mode">
                        <span class="theme-track">
                            <span class="theme-toggle-circle">
                                <i class="fa-solid fa-lightbulb" aria-hidden="true"></i>
                            </span>
                        </span>
                    </button>
                </div>
            </div>
            <nav class="breadcrumb-container" aria-label="Breadcrumb">
                <div class="container breadcrumb">
                    <a href="./" aria-current="page">Home</a>
                </div>
            </nav>
        </header>

        <main class="container main-content">
            <section class="directory-container" aria-label="Repositories">
                <div class="header-row">
                    <div class="col-name">Name</div>
                    <div class="col-size">Size</div>
                    <div class="col-sha">SHA-256</div>
                </div>
                <ul id="file-list" class="file-list" aria-label="Repository directories"></ul>
                <p id="loading-state" class="status" role="status">Loading repositories...</p>
                <p id="empty-state" class="status" role="status" hidden>No public Pages repositories found.</p>
                <p id="error-state" class="status error-state" role="alert" hidden>
                    Unable to load the repository directory. Please reload to try again.
                </p>
            </section>
        </main>

        <footer class="container footer">
            <p>Inspired by <a href="https://www.directorylister.com">Directory Lister</a></p>
            <div class="footer-links">
                <a class="social-github" href="https://github.com/garinasset" aria-label="GitHub" title="GitHub">
                    <i class="fa-brands fa-github" aria-hidden="true"></i>
                </a>
            </div>
        </footer>
    </div>
</body>

</html>
