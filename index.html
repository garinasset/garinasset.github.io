
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Downloads Directory - Garin Asset">
    <title>downloads.garinasset.com</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="icon" href="data:,">
</head>

<body class="light" id="theme-root">
    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <div class="brand">
                    <h1 class="brand-text">downloads.garinasset.com</h1>
                </div>

                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle Light/Dark Mode">
                    <div class="theme-toggle-inner">
                        <div class="theme-toggle-circle">💡</div>
                    </div>
                </button>
            </div>

            <!-- Breadcrumb -->
            <div class="breadcrumb-container">
                <div class="breadcrumb">
                    <span class="breadcrumb-item">Home</span>
                </div>
            </div>
        </header>

        <main class="main-content">
            <!-- Directory Table -->
            <div class="directory-container">
                <div class="directory-header">
                    <div class="header-row">
                        <div class="col-icon"></div>
                        <div class="col-name">Name</div>
                        <div class="col-sha">SHA-256</div>
                    </div>
                </div>

                <div id="file-list" class="file-list" aria-live="polite">
                    <div class="loading">Loading...</div>
                </div>

                <div id="empty-state" class="empty-state" hidden>
                    No items found.
                </div>

                <div id="error-state" class="error-state" hidden>
                    Unable to load directory.
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div>© <span id="current-year"></span> Garin Asset</div>
            <div>Powered by GitHub Pages</div>
        </footer>
    </div>

    <script src="./assets/js/app.js"></script>
</body>
</html>
