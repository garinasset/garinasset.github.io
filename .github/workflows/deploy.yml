name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: Home
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build website
        run: |
          mkdir -p _site
          cp index.html CNAME _site/
          cp favicon.ico favicon.svg favicon-96x96.png apple-touch-icon.png \
            site.webmanifest web-app-manifest-192x192.png web-app-manifest-512x512.png _site/
          cp -R assets _site/assets

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
