
name: Update Repository Directory

on:
  schedule:
    # Every day at 02:17 UTC
    - cron: "17 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-directory-update
  cancel-in-progress: false

jobs:
  update:
    name: Sync Public Repositories

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Repository Index
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const fs = require('fs');

            const username = 'garinasset';

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              {
                username,
                type: 'owner',
                per_page: 100
              }
            );

            const publicRepos = repos
              .filter(repo =>
                repo.owner.login.toLowerCase() ===
                  username.toLowerCase() &&
                repo.private === false
              )
              .map(repo => ({
                name: repo.name,
                url: repo.html_url
              }))
              .sort((a, b) =>
                a.name.localeCompare(b.name)
              );

            fs.writeFileSync(
              'repositories.json',
              JSON.stringify(publicRepos, null, 2) + '\n'
            );

            core.info(
              `Successfully indexed ${publicRepos.length} public repositories.`
            );

      - name: Commit Updated Index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repositories.json

          if git diff --cached --quiet; then
            echo "Repository index has not changed."
          else
            git commit -m "chore: update public repository directory"
            git push
          fi
